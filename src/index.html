<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S</title>
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          class="header__logo"
          src="<%=require('./images/Logo.svg')%>"
          alt="Around The U.S"
        />
      </header>

      <main class="content">
        <section class="profile page__section" id="profile">
          <div class="profile__avatar_container">
            <!-- <img
              src="<%=require('./images/Avatar.png')%>"
              alt="Avatar"
              class="profile__image"
            /> -->
            <button
              class="profile__avatar-button"
              id="profile__avatar-button"
              type="button"
            ></button>

            <!-- insert image here -->
            <img
              src="<%=require('./images/Avatar.png')%>"
              alt="Avatar"
              class="profile__image"
            />
          </div>
          <div class="profile__info">
            <h1 class="profile__title">Jacques Cousteau</h1>
            <button
              class="profile__edit-button"
              id="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description">Explorer</p>
          </div>
          <button class="profile__add-button" type="button"></button>
        </section>

        <section class="cards page__section" id="cards">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">&copy; 2024 Around The U.S.</p>
      </footer>
    </div>

    <!-- Modal Edit-->

    <div class="modal" id="profile__edit-modal">
      <div class="modal__container">
        <button class="modal__close" type="button"></button>
        <p class="modal__heading">Edit Profile</p>
        <form class="modal__form" id="profile-form">
          <label class="modal__lable">
            <input
              class="modal__input modal__input_type_name"
              name="name"
              id="profile-title-input"
              placeholder="Name"
              type="text"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="modal__error" id="profile-title-input-error"></span>
          </label>
          <label class="modal__lable">
            <input
              class="modal__input modal__input_type_description"
              name="description"
              id="profile-description-input"
              placeholder="description"
              type="text"
              minlength="2"
              maxlength="200"
              required
            />
            <span
              class="modal__error"
              id="profile-description-input-error"
            ></span>
          </label>
          <button class="modal__button" type="submit">Save</button>
        </form>
      </div>
    </div>

    <!--Image modal-->
    <div class="modal" id="image-modal">
      <div class="modal__preview-container">
        <img class="modal__image" src="" alt="" />
        <p class="modal__text"></p>
        <button class="modal__close" type="button"></button>
      </div>
    </div>

    <!-- Add Card Modal -->
    <div class="modal" id="add-card-modal">
      <div class="modal__container">
        <button class="modal__close" type="button"></button>
        <p class="modal__heading">New Place</p>
        <form class="modal__form" id="add-card-form">
          <label class="modal__lable">
            <input
              class="modal__input modal__input_type_title"
              name="title"
              id="add-card-title-input"
              placeholder="Name"
              type="text"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="modal__error" id="add-card-title-input-error"></span>
          </label>
          <label class="modal__lable">
            <input
              class="modal__input modal__input_type_url"
              name="url"
              id="add-card-url-input"
              placeholder="Image URL"
              type="url"
              required
            />
            <span class="modal__error" id="add-card-url-input-error"></span>
          </label>
          <button
            class="modal__button modal__button_disabled"
            type="submit"
            disabled="true"
          >
            Save
          </button>
        </form>
      </div>
    </div>

    <div class="modal" id="update-avatar-modal">
      <div class="modal__container">
        <button class="modal__close" type="button"></button>
        <p class="modal__heading">Change profile picture</p>
        <form class="modal__form" id="update-avatar-form" name="update-avatar">
          <label class="modal__label">
            <input
              class="modal__input modal__input_type_url"
              name="avatar"
              id="update-avatar-input"
              placeholder="Image link"
              type="url"
              required
            />
            <span class="modal__error" id="update-avatar-input-error"></span>
          </label>
          <button class="modal__button" type="submit" disabled>Save</button>
        </form>
      </div>
    </div>

    <template id="card-template">
      <li class="card">
        <button class="card__delete-button" type="button"></button>
        <img src="" class="card__image" alt="" />
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button class="card__like-button" type="button"></button>
        </div>
      </li>
    </template>

    <!-- Creating a popup for deleting a card -->
    <div class="modal" id="delete-card-modal">
      <div class="modal__container">
        <button class="modal__close" type="button"></button>
        <p class="modal__heading">Are you sure?</p>
        <form class="modal__form" id="delete-card-form">
          <button class="modal__button" type="submit">Yes</button>
        </form>
      </div>
    </div>
  </body>
</html>
